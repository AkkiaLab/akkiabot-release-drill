name: Release

# Backend image ghcr.io/akkialab/akkiabot:<sha>. Master pushes (cascade merges)
# build as before; release-rc.yml and release-production.yml call this workflow
# with the exact sha of an RC / formal tag (docs/release.md §4), so staging and
# production always pull an image built from the commit they deploy.

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        description: Full commit sha to build (defaults to the triggering commit)
        required: false
        type: string

concurrency:
  group: release-image-${{ inputs.sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/akkialab/akkiabot-release-drill  # 演练仓库：与生产镜像隔离

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Checked-out commit
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          # `latest` only follows master; release builds only get their sha.
          tags: |
            ${{ env.IMAGE }}:${{ steps.rev.outputs.sha }}
            ${{ inputs.sha == '' && github.ref == 'refs/heads/master' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
